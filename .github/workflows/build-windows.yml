name: Testar e gerar EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Testar conversão e OCR
        run: python -m unittest discover -s tests -v
      - name: Gerar executável
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDF-para-Markdown --icon assets/app.ico --add-data "assets/app.ico;assets" --add-data "assets/app.png;assets" --collect-all markitdown --collect-all pdfplumber --collect-all pymupdf --collect-all rapidocr --collect-all onnxruntime desktop_app.py
      - name: Testar executável empacotado
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'pdf-to-markdown-self-test.txt'
          $process = Start-Process -FilePath 'dist/PDF-para-Markdown.exe' -ArgumentList @('--self-test', $report) -PassThru -Wait -WindowStyle Hidden
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) { throw "O executável falhou no teste de conversão." }
      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: PDF-para-Markdown-Windows
          path: dist/PDF-para-Markdown.exe
          if-no-files-found: error

